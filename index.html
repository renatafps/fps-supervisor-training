:root{--navy:#123455;--blue:#16639a;--green:#4c7c2c;--pale:#edf4e8;--ink:#25394a;--muted:#607180;--line:#dce5e9}*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:var(--ink);font:17px/1.65 Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #77a642;outline-offset:4px}header{background:white;border-bottom:1px solid var(--line);padding:14px 30px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{position:relative;width:140px;height:57px;overflow:hidden}.brand img{position:absolute;width:221px;height:221px;max-width:none;left:-41px;top:-82px}.actions{display:flex;gap:10px}.btn{border:1px solid var(--line);border-radius:5px;padding:9px 16px;background:white;color:var(--navy);font-size:14px}.btn.primary{background:var(--navy);color:white;border-color:var(--navy)}.layout{display:grid;grid-template-columns:285px 1fr;min-height:calc(100vh - 87px)}aside{padding:30px 20px;background:white;border-right:1px solid var(--line)}.eyebrow{font-size:12px;letter-spacing:1.7px;text-transform:uppercase;font-weight:bold;color:var(--green)}aside .eyebrow{margin:0 12px 18px}.nav{width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:12px 12px;margin:3px 0;color:var(--muted);font-size:15px;line-height:1.45}.nav.active{border-color:var(--green);background:var(--pale);color:var(--navy);font-weight:bold}.nav .num{display:inline-block;width:28px;color:var(--green)}.status{margin:25px 12px;font-size:13px;color:var(--muted)}progress{width:100%;height:7px;accent-color:var(--green)}main{padding:45px 6vw 30px;max-width:1300px;width:100%;margin:auto}.hero{background:var(--navy);color:white;padding:45px 48px;border-radius:5px;margin-bottom:30px}.hero .eyebrow{color:#b8da94}h1{font-size:clamp(32px,3.2vw,48px);line-height:1.18;letter-spacing:-.8px;margin:16px 0 22px}h2{color:var(--navy);font-size:30px;line-height:1.25;margin:5px 0 25px}h3{co }.screen-count{font-size:13px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:800px){header{padding:12px 18px}.actions{gap:6px}.btn{padding:9px 10px}.layout{display:block}aside{padding:16px;border-right:0;border-bottom:1px solid var(--line)}#navigation{display:flex;overflow:auto}.nav{min-width:210px;width:auto}.status{margin:12px}.status progress{max-width:200px;display:block}main{padding:24px 16px}.hero,.lesson,.presentation .lesson{padding:26px 23px}.overview{grid-template-columns:1fr}.presentation h2{font-size:30px}.presentation .point p{font-size:19px}.footer{flex-wrap:wrap}}@media print{header,aside,.footer,button,details,.status{display:none!important}.layout{display:block}main{padding:0;max-width:none}.hero{background:white;color:var(--navy);padding:15px;break-after:avoid}.hero p{color:var(--ink)}.hero .eyebrow{color:var(--green)}.lesson{break-inside:avoid;border:0;border-bottom:1px solid var(--line);padding:20px}.example{background:white}body{background:white;font-size:12pt}}

.topic-icon{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;color:var(--blue);background:#eef4f8;border-radius:50%;flex-shrink:0}.topic-icon svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.hero .topic-icon{width:60px;height:60px;color:#c3df9e;background:#ffffff12;margin-bottom:16px}.hero .topic-icon svg{width:32px;height:32px}.heading-row{display:flex;align-items:flex-start;gap:15px;margin-bottom:25px}.heading-row h2{margin:4px 0 0}.takeaway{margin:30px 0 24px;padding:20px 24px;background:#edf4e8;border-left:4px solid var(--green);display:flex;gap:16px;align-items:flex-start}.takeaway .topic-icon{background:transparent;color:var(--green);width:28px;height:30px}.takeaway-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:bold;color:var(--green);margin-bottom:5px}.takeaway p{margin:0;font-size:20px;font-weight:bold;line-height:1.5;color:var(--navy)}.takeaway.safety{background:#fff4ed;border-color:#b15330}.takeaway.safety .topic-icon,.takeaway.safety .takeaway-label{color:#a4482a}.point.critical{border-left-color:#b15330;background:#fff5f0;padding:16px 20px}.point.critical h3{color:#a4482a}.process{gap:0}.process .point{position:relative;border-left:2px solid #c3d8b4;padding:0 0 25px 58px;margin-left:20px}.process .point:last-child{border-left-color:transparent;padding-bottom:0}.step-marker{position:absolute;left:-19px;top:-2px;width:36px;height:36px;background:var(--green);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold}.presentation .takeaway p{font-size:24px}@media(max-width:800px){.heading-row{gap:12px}.heading-row h2{font-size:26px}.takeaway{padding:18px}.takeaway p{font-size:18px}.process .point{padding-left:35px}}@media print{.topic-icon{background:none}.takeaway{break-inside:avoid}}

const modules=[{"title": "Role of the Cleaning Supervisor", "intro": "What the job really means — leadership, responsibility, and authority on site.", "lessons": [{"title": "What Is a Cleaning Supervisor?", "body": ["Leader on Site", "The supervisor sets the tone and standard for every shift.", "Link Between Staff, Management & Client", "A supervisor connects the cleaning team to company leadership and the client.", "Responsible for Results, Not Just Tasks", "Success is measured by outcomes — a clean, compliant, satisfied site — not by checking boxes."], "paired": true, "notes": ["“Supervisor ≠ just the best cleaner.”"]}, {"title": "Supervisor Responsibilities", "body": ["Staff Direction", "Assign, guide, and oversee the daily work of the team.", "Quality Control", "Confirm work meets FPS and client standards before sign-off.", "Safety Enforcement", "Ensure PPE and safe practices are followed at all times.", "Professional Conduct", "Model the behavior expected of every team member.", "Reporting & Documentation", "Keep accurate, timely records of work, issues, and hours."], "paired": true, "notes": []}, {"title": "Authority & Accountability", "body": ["Enforce Standards", "Hold the team to FPS and client expectations, every shift.", "Escalate Issues When Needed", "Know when a problem is above your authority and raise it promptly.", "Authority to Direct Staff", "You have the standing to assign work and correct performance in real time.", "Accountability for Outcomes", "You own the results of your site or shift — good or bad."], "paired": true, "notes": []}], "example": ["The team is behind schedule and a cleaner asks what to do next.", "Give a specific assignment based on the site’s scope of work, check that the person understands, and follow up. Escalate issues beyond your authority."], "quiz": ["A request is beyond your authority. What is the best response?", ["Promise the client you will approve it.", "Escalate it to the appropriate manager.", "Ignore it until the
